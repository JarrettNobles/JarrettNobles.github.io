<html lang="en">
<head>

  <style>
    @font-face {
  font-family: 'Juniper Bay';
  src: url('fonts/JuniperBay-Regular.woff2') format('woff2'),
       url('fonts/JuniperBay-Regular.woff') format('woff');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}
    /* Used for the navbar links only, to match index.html/contact.html/resume.html's nav font */
    @font-face {
  font-family: 'Black Mango';
  src: url('fonts/Black Mango Regular.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}

    body {
      font-family: 'Juniper Bay', cursive;
      background-color: #fff; /* white page background, matches index.html */
    }

    /* ── SPLIT NAV ── */
    .site-nav {
      display: flex;
      align-items: center;
      justify-content: center; /* single unified link list, centered now that the logo has moved out of the navbar (matches index.html) */
      padding: 1.4rem 4rem;
      background: #fff;
      border-bottom: 4px solid #FFB3AE; /* pink divider line, matches resume.html/About's panel divider */
      position: relative;
    }
    .nav-group {
      display: flex;
      gap: 2.25rem;
      align-items: center;
    }
    .nav-link {
      text-decoration: none;
      color: #1697a6; /* teal, matches index.html's navbar text color */
      font-family: 'Black Mango', cursive;
      font-size: 1.45rem;
      font-weight: 400;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    /* Coral on hover, matches index.html's navbar hover + the @coralolsonphotography handle color */
    .nav-link:hover { color: #F47068; }
    /* Decorative seashell image pinned to the navbar's right corner (desktop only; hidden on
       mobile below so it doesn't collide with the hamburger button, which takes that spot). */
    .nav-decor {
      position: absolute;
      right: 1.25rem;
      top: 50%;
      transform: translateY(-50%);
      height: 60px;
      width: auto;
      display: block;
    }
    /* ── LOGO (moved out of the navbar; its own block below it, matches index.html) ── */
    .logo-block {
      text-align: center;
      padding: 2.5rem 1.5rem 2rem;
    }
    .logo-block img {
      height: 180px;
      width: auto;
      display: inline-block;
    }
    .nav-toggle {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      flex-direction: column;
      gap: 5px;
      padding: 4px;
    }
    .nav-toggle span {
      display: block;
      width: 22px;
      height: 1.5px;
      background: #1c1c1e;
      transition: transform 0.25s, opacity 0.25s;
    }
    @media (max-width: 900px) {
      .site-nav { padding: 1.1rem 2rem; }
      .logo-block img { height: 130px; }
    }
    @media (max-width: 768px) {
      .site-nav { justify-content: flex-end; } /* the hamburger is now the only visible nav child, so push it to the right edge */
      .nav-group { display: none; }
      .nav-toggle { display: flex; }
      .nav-decor { display: none; } /* hide the seashell so it doesn't collide with the hamburger button in the same corner */
      .logo-block img { height: 100px; }
      .site-nav.open .nav-group {
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
        position: absolute;
        top: 100%;
        left: 0; right: 0;
        background: #fff;
        padding: 1.5rem 2rem;
        border-bottom: 1px solid rgba(0,0,0,0.07);
        z-index: 100;
      }
    }

    .about-image-section {
      padding: 4rem 0;
    }

    .about-image-section img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      display: block;
    }

    /* The footer band that contains the "click to open Instagram" call-to-action, matches
       index.html/contact.html's Instagram footer exactly. */
    .instagram-footer {
      background-color: #FFF4F1;
      padding: 4rem 2rem;
      text-align: center;
      /* Overrides css/styles.css's old .instagram-footer rules (position/height/overflow),
         which are leftovers from the original dark hover-reveal design and no longer apply here */
      position: static;
      height: auto;
      overflow: visible;
    }
    /* css/styles.css also adds an invisible ::after overlay for that old design
       (position:absolute; inset:0), which — even at opacity:0 — sits on top of the link
       and silently blocks clicks. Removing it entirely fixes the Instagram link. */
    .instagram-footer::after {
      display: none;
    }
    .instagram-footer a {
      display: inline-block;
      color: #1697a6; /* teal, matches index.html's Instagram footer */
      text-decoration: none;
    }
    .instagram-footer a:hover { opacity: 0.75; }
    .instagram-footer i {
      font-size: 1.4rem;
      display: block;
      margin-bottom: 0.75rem;
    }
    .instagram-footer h2 {
      font-family: 'Black Mango', cursive;
      font-weight: 300;
      font-size: 1.4rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }
    .instagram-footer p {
      font-size: 1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #F47068; /* coral, matches the @coralolsonphotography handle on index.html */
    }
    /* Bottom-most strip with the copyright line, matches index.html/contact.html's teal footer strip */
    .footer-bottom {
      background: #1697a6;
      color: #fff;
      padding: 1.1rem 3rem;
      font-size: 0.85rem;
      letter-spacing: 1px;
    }

    /* --------- MOBILE & A11Y ENHANCEMENTS (ADDED) --------- */

    /* Tappable nav targets + subtle divider */
    .navbar { border-bottom: 1px solid rgba(0,0,0,0.06); }
    .navbar-toggler { border: 1px solid rgba(0,0,0,0.2) !important; }
    .navbar-nav .nav-link { padding: .75rem .75rem; } /* bigger tap targets */

    /* Constrain content width while staying centered on large screens */
    .pricing-container { max-width: 960px; margin-inline: auto; }

    /* Gentle elevation for the pricing images (kept subtle) */
    .about-image-section img { box-shadow: 0 2px 18px rgba(0,0,0,0.06); }

    /* Phone-friendly spacing */
    @media (max-width: 576px) {
      .about-image-section { padding: 2.25rem 0; }
    }

    /* Avoid iOS white gaps: ensure images keep natural aspect on small screens */
    @media (max-width: 768px) {
      .about-image-section img {
        width: 100% !important;
        height: auto !important;
        object-fit: contain !important;
        display: block;
      }
    }

    /* Respect reduced motion */
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

    /* LONG‑PRESS / SAVE PROTECTION (ADDED, NON‑DESTRUCTIVE) */
    .no-save {
      -webkit-touch-callout: none;   /* iOS: hide callout on long-press */
      -webkit-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
      -user-drag: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /* Optional screen-reader helper */
    .sr-only {
      position: absolute !important;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,1px,1px);
      white-space: nowrap; border: 0;
    }
  </style>
</head>
<body class="d-flex flex-column h-100">

      <!-- Added attributes are non-destructive; your <img> tags remain -->

</main>

<!-- Mobile nav toggle -->
<script>
  (function () {
    'use strict';
    var nav = document.getElementById('siteNav');
    var btn = document.getElementById('navToggle');
    if (btn && nav) {
      btn.addEventListener('click', function () {
        var open = nav.classList.toggle('open');
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    }
  })();
</script>

<!-- Protection Script -->
<script>
  /* BEST PRACTICES: isolate in IIFE + strict mode; keep your original behavior intact */
  (function(){
    'use strict';
    document.addEventListener('DOMContentLoaded', function () {
      // Disable cut, copy, paste
      document.body.addEventListener('cut', e => e.preventDefault(), { passive: false });
      document.body.addEventListener('copy', e => e.preventDefault(), { passive: false });
      document.body.addEventListener('paste', e => e.preventDefault(), { passive: false });

      // Disable right-click and drag on images
      const images = document.querySelectorAll('img');
      images.forEach(img => {
        img.addEventListener('contextmenu', e => e.preventDefault(), { passive: false });
        img.addEventListener('dragstart', e => e.preventDefault(), { passive: false });
        img.setAttribute('draggable', 'false');
        // ensure mobile protection class even if not in markup
        img.classList.add('no-save');
      });

      // a11y: visible focus ring without global CSS changes
      document.querySelectorAll('a, button').forEach(el => {
        el.addEventListener('focus', () => el.style.outline = '2px solid rgba(0,0,0,0.35)', { passive: true });
        el.addEventListener('blur',  () => el.style.outline = 'none', { passive: true });
      });

      /* EXTRA: iOS/Android long-press guard (non-destructive) */
      let pressTimer;
      images.forEach(img => {
        const cancelTimer = () => { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } };

        img.addEventListener('touchstart', (e) => {
          // allow normal taps/scroll; only block if it becomes a long press
          pressTimer = setTimeout(() => { try { e.preventDefault(); } catch {} }, 450);
        }, { passive: false });

        img.addEventListener('touchend', cancelTimer, { passive: true });
        img.addEventListener('touchmove', cancelTimer, { passive: true });
        img.addEventListener('pointerup', cancelTimer, { passive: true });

        // iOS gesture safeguard
        img.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });
      });

      // Reduced-data users: avoid extra decode hints
      if (window.matchMedia && window.matchMedia('(prefers-reduced-data: reduce)').matches) {
        document.querySelectorAll('img[loading="lazy"]').forEach(img => img.removeAttribute('decoding'));
      }
    });
  })();
</script>
