  <!-- Preload the site font so the navbar renders in Black Mango immediately instead of flashing the fallback font -->
  <link rel="preload" href="fonts/Black%20Mango%20Regular.ttf" as="font" type="font/ttf" crossorigin />

  <style>
    /* Site font, matches index.html/contact.html/resume.html */
    @font-face {
  font-family: 'Black Mango';
  src: url('fonts/Black Mango Regular.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Black Mango', cursive;
      background-color: #fff; /* white page background, matches index.html */
      color: #1c1c1e;
    }

    /* ── NAV ── */
    .site-nav {
      display: flex;
      align-items: center;
      justify-content: center; /* single unified link list, centered now that the logo has moved out of the navbar (matches index.html) */
      padding: 1.4rem 4rem;
      background: #fff;
      border-bottom: 4px solid #FFB3AE; /* pink divider line, matches resume.html/About's panel divider */
      position: relative;
    }
    .nav-group {
      display: flex;
      gap: 2.25rem;
      align-items: center;
    }
    .nav-link {
      text-decoration: none;
      color: #1697a6; /* teal, matches index.html's navbar text color */
      font-family: 'Black Mango', cursive;
      font-size: 1.45rem;
      font-weight: 400;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    /* Coral on hover, matches index.html's navbar hover + the @coralolsonphotography handle color */
    .nav-link:hover { color: #F47068; }
    /* Decorative seashell image pinned to the navbar's right corner (desktop only; hidden on
       mobile below so it doesn't collide with the hamburger button, which takes that spot). */
    .nav-decor {
      position: absolute;
      right: 1.25rem;
      top: 50%;
      transform: translateY(-50%);
      height: 60px;
      width: auto;
      display: block;
    }
    /* ── LOGO (moved out of the navbar; its own block below it, matches index.html) ── */
    .logo-block {
      text-align: center;
      padding: 2.5rem 1.5rem 2rem;
    }
    .logo-block img {
      height: 180px;
      width: auto;
      display: inline-block;
    }

    /* hamburger (mobile) */
    .nav-toggle {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      flex-direction: column;
      gap: 5px;
      padding: 4px;
    }
    .nav-toggle span {
      display: block;
      width: 22px;
      height: 1.5px;
      background: #1c1c1e;
      transition: transform 0.25s, opacity 0.25s;
    }

    /* ── HERO ── */
    .page-hero {
      background-color: #FFF4F1;         /* cream, matches the footer and card panels (replaces the old tan #f2f1ec) */
      text-align: center;
      padding: 4rem 2rem;
    }
    .page-hero h1 {
      font-family: 'Black Mango', cursive;
      font-weight: 300;
      font-size: clamp(2.5rem, 6vw, 4.5rem); /* scales fluidly between mobile and desktop, same as contact.html's heading */
      letter-spacing: 10px;
      text-transform: uppercase;
      line-height: 1;
      color: #1697a6;                    /* teal, matches the navbar and footer */
    }

    /* ── MASONRY GALLERY ── */
    .gallery-section {
      padding: 3rem 5% 1rem;
    }
    .masonry-grid {
      column-count: 3;
      column-gap: 8px;
    }
    .masonry-item {
      break-inside: avoid;
      margin-bottom: 8px;
    }
    .masonry-item img {
      display: block;
      width: 100%;
      height: auto;
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* ── CTA ── */
    .cta-section {
      text-align: center;
      padding: 3.5rem 2rem;
    }
    .btn-cta {
      display: inline-block;
      background: #1c1c1e;
      color: #fff;
      text-decoration: none;
      font-family: 'Black Mango', cursive;
      font-size: 0.9rem;
      font-weight: 400;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      padding: 1rem 2.75rem;
      transition: background 0.2s;
    }
    .btn-cta:hover { background: #3a3a3a; color: #fff; }

    /* ── FOOTER ── */
    .instagram-footer {
      background-color: #FFF4F1; /* cream, matches index.html/contact.html */
      padding: 4rem 2rem;
      text-align: center;
    }
    .instagram-footer a {
      display: inline-block;
      color: #1697a6; /* teal, matches index.html's Instagram footer */
      text-decoration: none;
    }
    .instagram-footer a:hover { opacity: 0.75; }
    .instagram-footer i {
      font-size: 1.4rem;
      display: block;
      margin-bottom: 0.75rem;
    }
    .instagram-footer h2 {
      font-family: 'Black Mango', cursive;
      font-weight: 300;
      font-size: 1.4rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }
    .instagram-footer p {
      font-size: 1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #F47068; /* coral, matches the @coralolsonphotography handle on index.html */
    }
    .footer-bottom {
      background: #1697a6;
      color: #fff;
      padding: 1.1rem 3rem;
      font-size: 0.85rem;
      letter-spacing: 1px;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      .site-nav { padding: 1.1rem 2rem; }
      .logo-block img { height: 130px; }
    }

    @media (max-width: 768px) {
      .masonry-grid { column-count: 2; }

      .site-nav { justify-content: flex-end; } /* the hamburger is now the only visible nav child, so push it to the right edge */
      .nav-group { display: none; }
      .nav-toggle { display: flex; }
      .nav-decor { display: none; } /* hide the seashell so it doesn't collide with the hamburger button in the same corner */
      .logo-block img { height: 100px; }

      .site-nav.open .nav-group {
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: #fff;
        padding: 1.5rem 2rem;
        border-bottom: 1px solid rgba(0,0,0,0.07);
        z-index: 100;
      }
    }

    @media (max-width: 480px) {
      .masonry-grid { column-count: 1; }
      .page-hero h1 { font-size: 2rem; letter-spacing: 6px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>

  <!-- Mobile nav toggle -->

          var open = nav.classList.toggle('open');
          btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        });
      }
    })();
  </script>

  <!-- Image protection -->
  <script>
    (function () {
      'use strict';
      document.addEventListener('DOMContentLoaded', function () {
        document.body.addEventListener('cut',   function (e) { e.preventDefault(); }, { passive: false });
        document.body.addEventListener('copy',  function (e) { e.preventDefault(); }, { passive: false });
        document.body.addEventListener('paste', function (e) { e.preventDefault(); }, { passive: false });

        var images = document.querySelectorAll('img');
        var pressTimer = null;

        images.forEach(function (img) {
          img.addEventListener('contextmenu', function (e) { e.preventDefault(); }, { passive: false });
          img.addEventListener('dragstart',   function (e) { e.preventDefault(); }, { passive: false });
          img.setAttribute('draggable', 'false');

          var cancelTimer = function () {
            if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
          };
          img.addEventListener('touchstart', function (e) {
            pressTimer = window.setTimeout(function () {
              try { e.preventDefault(); } catch (err) {}
            }, 450);
          }, { passive: false });
          img.addEventListener('touchend',    cancelTimer, { passive: true });
          img.addEventListener('touchmove',   cancelTimer, { passive: true });
          img.addEventListener('pointerup',   cancelTimer, { passive: true });
          img.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
        });
      });
    })();
  </script>

  <!-- Cloudinary dynamic image loading -->
  <script>
    (function () {
      'use strict';
      fetch('https://res.cloudinary.com/dgqsc76ni/image/list/portraits.json')
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (!data.resources || data.resources.length === 0) { return; }
          var grid = document.querySelector('.masonry-grid');
          if (!grid) { return; }
          grid.innerHTML = '';
          data.resources.forEach(function (resource, index) {
            var item = document.createElement('div');
            item.className = 'masonry-item';
            var img = document.createElement('img');
            img.src = 'https://res.cloudinary.com/dgqsc76ni/image/upload/q_auto,f_auto/' + resource.public_id;
            img.alt = 'Portrait photo';
            img.loading = index === 0 ? 'eager' : 'lazy';
            img.draggable = false;
            img.style.pointerEvents = 'none';
            item.appendChild(img);
            grid.appendChild(item);
          });
        })
        .catch(function () { /* fetch failed — keep static images */ });
    })();
  </script>
